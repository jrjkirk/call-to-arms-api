app = "call-to-arms-api"
primary_region = "lhr"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Keep one machine always running so the first request after an idle spell
  # (e.g. the first signup on a quiet club night) doesn't pay a cold-start wake.
  min_machines_running = 1

# Without this, nothing notices the app has stopped answering. On 2026-09-09 the
# VM wedged and flyd went on reporting it as "started" for hours, because a
# thrashing machine never exits and there was nothing else being asked. It
# stayed down until a person complained.
#
# Pointed at /health DELIBERATELY, which returns a literal dict and touches no
# database. The job here is "is this process still answering", not "is Supabase
# well". A check on a DB-backed route would turn a thirty-second Supabase blip
# into a restart loop, which is worse than the thing it is guarding against.
#
# 5s timeout against an endpoint that answers in under 50ms, so only a genuine
# stall trips it. 20s grace covers boot.
[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  # 256 MB wedged the whole VM on 2026-09-09. At rest, with no traffic, the app
  # held 167 MB of the ~207 MB a 256 MB machine actually gives you, so a couple
  # of concurrent admin page loads had nowhere to go. There is no swap, so the
  # kernel thrashed instead of OOM-killing anything: the API, and Fly's own SSH
  # daemon, both stopped answering while flyd still reported the machine as
  # "started". It stayed down until a human noticed.
  #
  # Keep this in fly.toml rather than `fly scale memory`, or the next deploy
  # reads this file and silently puts it back to 256.
  memory_mb = 512
