name: Post Pairings Image to Discord
on:
  workflow_dispatch:
    inputs:
      system:
        # A free-text string, NOT a choice list. It was a choice of the three
        # original systems, so dispatching for any system added later — Age of
        # Sigmar, Warhammer 40,000, Middle Earth — was rejected by GitHub with
        # a 422 and the admin page just said "Post to Discord" had failed.
        #
        # The value has to match SystemConfig.legacy_system_name exactly. A
        # dropdown that has to be edited every time a club adds a game is a
        # dropdown that will be wrong again; the app is the caller that matters
        # and it sends the name straight from the catalogue.
        description: 'System — exactly as it appears in the catalogue, e.g. The Old World'
        required: true
      week:
        description: 'Week (DD/MM/YYYY)'
        required: true
      club:
        description: 'Club slug (leave blank if only one club runs this system)'
        required: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt matplotlib
      - run: python scripts/post_pairings_image.py
        env:
          PYTHONPATH: ${{ github.workspace }}
          SYSTEM: ${{ inputs.system }}
          WEEK: ${{ inputs.week }}
          CLUB: ${{ inputs.club }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_TOW_PAIRINGS_WEBHOOK_URL: ${{ secrets.DISCORD_TOW_PAIRINGS_WEBHOOK_URL }}
          DISCORD_HH_PAIRINGS_WEBHOOK_URL: ${{ secrets.DISCORD_HH_PAIRINGS_WEBHOOK_URL }}
          DISCORD_KT_PAIRINGS_WEBHOOK_URL: ${{ secrets.DISCORD_KT_PAIRINGS_WEBHOOK_URL }}
