name: Post League Rankings Image to Discord

# MANUAL ONLY. The schedule moved to league-rankings-check.yml and the
# in-process scheduler, where the club sets its own day and time and the post
# is deduped. The weekly `0 19 * * 4` cron that used to live here is gone:
# leaving it would post the standings a second time every Thursday.
#
# This is the override — it posts every league-enabled club-system's standings
# immediately and records nothing, so using it never makes the scheduled post
# think it has already gone out.
on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt matplotlib
      - run: python scripts/post_league_rankings_image.py
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_LEAGUE_RANKINGS_WEBHOOK_URL: ${{ secrets.DISCORD_LEAGUE_RANKINGS_WEBHOOK_URL }}