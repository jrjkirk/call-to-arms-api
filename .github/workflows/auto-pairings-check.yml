name: Auto-Pairings Check

# This is no longer where auto-pairings actually happens. Generating and
# publishing pairings runs on the in-process scheduler (scheduler.py) every
# five minutes, because GitHub's "hourly" cron really fires about five times a
# day and a club whose pairings were due at 21:00 lost its week to a run that
# arrived at 20:57.
#
# What still runs here is the half that needs matplotlib: rendering the
# pairings image and posting it to Discord. Two things reach it —
#
#   workflow_dispatch — fired by the app the moment pairings are published.
#                       Dispatched runs are NOT throttled the way scheduled
#                       ones are, so this is what makes the post prompt.
#   schedule          — the backstop, for any week whose image never went out
#                       (a failed dispatch, no token configured, a broken
#                       webhook since fixed). The job re-checks the post step
#                       on every visit, independently of whether it paired.
on:
  schedule:
    # Deliberately not on the hour: ':00' is the most contended slot on
    # GitHub's scheduler and these runs were being throttled to about five
    # a day. Staggered across the hourly jobs so they don't queue behind
    # each other either.
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt matplotlib
      - run: python scripts/run_auto_pairings_check.py
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_PUBLIC_URL: ${{ secrets.APP_PUBLIC_URL }}
          DISCORD_TOW_PAIRINGS_WEBHOOK_URL: ${{ secrets.DISCORD_TOW_PAIRINGS_WEBHOOK_URL }}
          DISCORD_HH_PAIRINGS_WEBHOOK_URL: ${{ secrets.DISCORD_HH_PAIRINGS_WEBHOOK_URL }}
          DISCORD_KT_PAIRINGS_WEBHOOK_URL: ${{ secrets.DISCORD_KT_PAIRINGS_WEBHOOK_URL }}
